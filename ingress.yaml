# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallet-ingress
  namespace: wallet-app
spec:
  rules:
    - host: wallet.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wallet-api
                port:
                  number: 8080
